[theme]
base = "light"
primaryColor = "#078c92"
backgroundColor = "#fbfbfa"
secondaryBackgroundColor = "#f7f8f8"
textColor = "#14213d"
# Input fields get a visible border before they are focused; the field fill is too close to the page colour alone.
showWidgetBorder = true
font = "sans-serif"

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
port = 8501
headless = false
runOnSave = false
fileWatcherType = "none"
maxUploadSize = 500

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
