[theme]
base = "light"
primaryColor = "#078c92"
backgroundColor = "#fbfbfa"
secondaryBackgroundColor = "#f7f8f8"
textColor = "#14213d"
font = "sans-serif"

[browser]
gatherUsageStats = false

[server]
address = "127.0.0.1"
port = 8501
headless = false
runOnSave = false
fileWatcherType = "none"
maxUploadSize = 500

[client]
showErrorDetails = "none"
toolbarMode = "minimal"
